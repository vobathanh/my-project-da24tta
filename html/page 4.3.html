<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thay đổi mật khẩu</title>
    <link rel="stylesheet" href="../css/stylepage4.3.css">
</head>
<body>

<div class="container">
    <table>
        <tr>
            <th colspan="2">Thay đổi mật khẩu</th>
        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td>Tên đăng nhập:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Mật khẩu cũ:</td>
            <td><input type="password"></td>
        </tr>

        <tr>
            <td>Mật khẩu mới:</td>
            <td><input type="password"></td>
        </tr>

        <tr>
            <td>Nhập lại mật khẩu:</td>
            <td><input type="password"></td>
        </tr>

        <tr>
            <td colspan="2" class="btn">
                <button>Gửi</button>
            </td>
        </tr>
    </table>
</div>

        <script src="page4.3.js"></script>
</body>
</html>
