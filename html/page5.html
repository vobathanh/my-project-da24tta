<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách hoa</title>

    <link rel="stylesheet" href="../css/stylepage 5.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container" id="container">

        <!-- MENU -->
        <nav class="menu">

            <button onclick="filterProduct('all')">
                Tất cả ▼
            </button>

            <button onclick="filterProduct('hong')">
                Hoa hồng ▼
            </button>

            <button onclick="filterProduct('tulip')">

            </button>

            <button onclick="filterProduct('huongduong')">
                Hoa hướng dương ▼
            </button>

            <button onclick="filterProduct('ly')">
                Hoa ly ▼
            </button>

            <button onclick="filterProduct('camtucau')">
                Hoa cẩm tú cầu ▼
            </button>

            <button class="contact-btn" onclick="showContact()">
                Liên hệ
            </button>

        </nav>

        <!-- liên hệ -->
        <div class="contact-box" id="contact-box">

            <p>Email: hoatuoi@gmail.com</p>

            <p>Hotline: 0123 456 789</p>

            <p>Địa chỉ: phường Trà Vinh, Tp.Trà Vinh, tỉnh Vĩnh Long</p>

        </div>

        <!-- tiêu đề -->
        <h1>Tất cả sản phẩm</h1>

        <!-- giỏ hàng -->
        <h2 class="cart-box">
            Giỏ hàng:
            <span id="cart-count">0</span>
        </h2>

        <!-- sản phẩm -->
        <div class="row" id="product-list">

        </div>

    </div>

    <script src="../js/page 5.js"></script>

</body>
</html>
